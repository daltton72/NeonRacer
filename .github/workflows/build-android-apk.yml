name: Build NeonRacer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NeonRacer-Android/**'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Gradle wrapper JAR
        working-directory: NeonRacer-Android
        run: |
          base64 --decode gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build APK
        working-directory: NeonRacer-Android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonRacer-Android-debug-APK
          path: NeonRacer-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
