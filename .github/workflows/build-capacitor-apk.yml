name: Build NeonRacer Capacitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NeonRacer-Capacitor/**'
      - 'NeonRacer_v31.91_APK_Preparation_AutoTilt_Immersive.html'

permissions:
  contents: read

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor packages
        working-directory: NeonRacer-Capacitor
        run: npm install

      - name: Prepare bundled NeonRacer game
        working-directory: NeonRacer-Capacitor
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        working-directory: NeonRacer-Capacitor
        run: npx cap add android

      - name: Apply landscape and fullscreen settings
        working-directory: NeonRacer-Capacitor
        run: npm run prepare:android

      - name: Sync Capacitor Android project
        working-directory: NeonRacer-Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: NeonRacer-Capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Capacitor APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonRacer-Capacitor-APK
          path: NeonRacer-Capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
